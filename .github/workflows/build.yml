name: Build IPA

on:
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: brew install xcodegen ldid

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          xcodebuild \
            -project BrowserPlayer.xcodeproj \
            -scheme BrowserPlayer \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA with CarPlay entitlement (for TrollStore)
        run: |
          APP=build/Build/Products/Release-iphoneos/BrowserPlayer.app
          ldid -SSupport/BrowserPlayer.entitlements "$APP/BrowserPlayer"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry BrowserPlayer.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: BrowserPlayer-ipa
          path: BrowserPlayer.ipa
